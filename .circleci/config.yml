          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dns-doh -j2
      - run:
          name: Query over HTTPS
          command: LIONSS_LP=1 ./build/dns-doh --conf doh.conf --qname example

